# render.yaml — Blueprint để deploy MapViet Neon lên Render.com
#
# Cách dùng:
# 1. Tạo một Git repo (GitHub/GitLab) và đẩy TOÀN BỘ NỘI DUNG của thư mục "mapviet"
#    (server.js, package.json, src/, public/, render.yaml, ...) lên làm gốc (root) repo đó.
#    -> Nếu bạn để trong một repo lớn hơn (monorepo), vào Render Dashboard, mục
#       "Root Directory" của service, nhập đường dẫn tới thư mục "mapviet" tương ứng.
# 2. Vào Render Dashboard -> New -> Blueprint -> chọn repo đó.
#    Render sẽ tự đọc file này và tạo Web Service tương ứng.
# 3. Bấm "Apply" để Render build & deploy. Sau khi xong, mở đường dẫn Render cấp
#    (dạng https://mapviet-neon.onrender.com).
#
# Tài khoản Admin mặc định vẫn là:
#   tunglaihoclaptrinhmobile@1234 / TtungnguyenhoangNHmobile@142010
# (được tự tạo trong data/db.json ngay lần khởi động đầu tiên trên Render)
#
# Lưu ý gói Free của Render: service sẽ "ngủ" sau ~15 phút không có truy cập và
# mất vài chục giây để "thức dậy" ở lượt truy cập kế tiếp — đây là giới hạn của
# gói Free, không phải lỗi ứng dụng. Nâng lên gói trả phí để chạy 24/7 không ngủ.

services:
  - type: web
    name: mapviet-neon
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: JWT_SECRET
        generateValue: true
    disk:
      name: mapviet-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
