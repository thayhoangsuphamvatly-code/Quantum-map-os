# render.yaml — Blueprint để deploy MapViet Neon lên Render.com
#
# Cách dùng:
# 1. Tạo một Git repo (GitHub/GitLab) và đẩy TOÀN BỘ NỘI DUNG của thư mục "mapviet"
#    (server.js, package.json, src/, public/, render.yaml, ...) lên làm gốc (root) repo đó.
#    -> Nếu bạn để trong một repo lớn hơn (monorepo), vào Render Dashboard, mục
#       "Root Directory" của service, nhập đường dẫn tới thư mục "mapviet" tương ứng.
# 2. Vào Render Dashboard -> New -> Blueprint -> chọn repo đó.
#    Render sẽ tự đọc file này và tạo Web Service tương ứng.
# 3. Bấm "Apply" để Render build & deploy. Sau khi xong, mở đường dẫn Render cấp
#    (dạng https://mapviet-neon.onrender.com).
#
# Tài khoản Admin mặc định vẫn là:
#   tunglaihoclaptrinhmobile@1234 / TtungnguyenhoangNHmobile@142010
# (được tự tạo trong data/db.json ngay lần khởi động đầu tiên)
#
# ⚠️ QUAN TRỌNG — giới hạn của gói Free trên Render:
# Gói "free" KHÔNG hỗ trợ ổ đĩa bền vững (persistent disk), nên file
# "data/db.json" sẽ bị XÓA và tạo lại (chỉ còn tài khoản Admin mặc định) mỗi khi
# service được deploy lại hoặc khởi động lại — mọi tài khoản/địa điểm yêu thích
# tạo thêm sẽ mất theo. Đây là giới hạn của Render, không phải lỗi ứng dụng.
# Nếu cần dữ liệu được lưu bền vững lâu dài, hãy:
#   (a) nâng cấp "plan" bên dưới thành "starter" trở lên rồi thêm lại khối "disk"
#       (xem phần comment mẫu ở cuối file), hoặc
#   (b) thay src/store.js bằng một database ngoài (PostgreSQL/MongoDB...) —
#       Render có addon PostgreSQL miễn phí có thể khai báo thêm trong file này.
#
# Gói Free cũng sẽ tự "ngủ" sau ~15 phút không có truy cập và mất khoảng
# 30–60 giây để "thức dậy" ở lượt truy cập kế tiếp.

services:
  - type: web
    name: mapviet-neon
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: JWT_SECRET
        generateValue: true

# Mẫu để bật lưu trữ bền vững — CHỈ hoạt động với plan trả phí (starter trở lên).
# Bỏ dấu "#" ở 4 dòng dưới đây và đổi "plan: free" ở trên thành "plan: starter"
# nếu bạn nâng cấp gói trả phí và muốn dữ liệu không mất khi deploy lại:
#
#     disk:
#       name: mapviet-data
#       mountPath: /opt/render/project/src/data
#       sizeGB: 1
